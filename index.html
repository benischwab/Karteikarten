<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karteikarten</title>
<style>
:root{--bg:#eef1f5;--ink:#1c2433;--muted:#5d6779;--card:#fff;--back:#1c2433;--backink:#f3f5f8;--ok:#1f8a5b;--no:#c4452d;--line:#cfd6e0}
@media (prefers-color-scheme:dark){:root{--bg:#12161e;--ink:#e8ecf2;--muted:#98a2b3;--card:#1d2330;--back:#e8ecf2;--backink:#1c2433;--line:#2c3547}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;padding:16px}
main{width:100%;max-width:560px}
[hidden]{display:none!important}
h1{font-size:26px;margin:8px 0 18px}
h2{font-size:18px;margin:0}
.folder{margin-bottom:22px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px}
.fhead span{font:13px system-ui,sans-serif;color:var(--muted)}
.deck{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer;color:var(--ink)}
.deck .t{font-weight:600;font-size:16px}
.deck .m{font:13px system-ui,sans-serif;color:var(--muted);margin-top:2px}
.deck .pb{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.deck .pb i{display:block;height:100%;background:var(--ok)}
.deck.all{background:transparent;border-style:dashed}
.msg{font:15px system-ui,sans-serif;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
header button{flex:0 0 auto;min-width:0;padding:6px 10px;font-size:13px}
#title{font:600 15px system-ui,sans-serif;margin:0 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.scene{perspective:1200px;height:min(62vh,460px);cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:24px;display:flex;align-items:safe center;justify-content:center;text-align:left;overflow:auto;white-space:pre-line;font-size:clamp(15px,4.2vw,19px);line-height:1.45;border:1px solid var(--line)}
.front{background:var(--card)}
.rear{background:var(--back);color:var(--backink);transform:rotateY(180deg)}
.hint{text-align:center;font:13px system-ui,sans-serif;color:var(--muted);margin:10px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 15px system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;border-radius:10px;cursor:pointer;flex:1;min-width:90px}
button:focus-visible,.scene:focus-visible,.deck:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.no{background:var(--no);border-color:var(--no);color:#fff}
.tools{margin-top:18px}
.tools button{font-weight:500;font-size:14px}
.done{text-align:center;font-family:system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.editor label{display:block;font:600 13px system-ui,sans-serif;margin:14px 0 4px}
input,textarea{width:100%;font:16px system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:110px;resize:vertical}
.pend{font:14px system-ui,sans-serif;margin:12px 0;padding-left:22px}
.pend li{margin-bottom:6px}
.pend button{min-width:0;flex:0 0 auto;padding:2px 8px;margin-left:6px;font-size:13px}
#btnNew{margin-bottom:18px}
#eInfo a{color:inherit}
</style>
</head>
<body>
<main>

<section id="home">
  <h1>Karteikarten</h1>
  <button id="btnNew" class="deck all"><span class="t">+ Neue Karten hinzufügen</span></button>
  <div id="list"><p class="msg">Lade Themen …</p></div>
</section>

<section id="learn" hidden>
  <header><button id="btnHome">← Übersicht</button><span id="count"></span><span id="score"></span></header>
  <p id="title"></p>
  <div class="bar"><i id="bar"></i></div>
  <div class="scene" id="scene" tabindex="0" role="button" aria-label="Karte umdrehen">
    <div class="card" id="card">
      <div class="face front" id="front"></div>
      <div class="face rear" id="rear"></div>
    </div>
  </div>
  <p class="hint">Antippen oder Leertaste zum Umdrehen · Pfeiltasten zum Blättern</p>
  <div class="row">
    <button class="no" id="btnNo">Nochmal</button>
    <button class="ok" id="btnOk">Gewusst</button>
  </div>
  <div class="row tools">
    <button id="btnPrev">Zurück</button>
    <button id="btnShuffle">Mischen</button>
    <button id="btnOnly">Nur offene</button>
    <button id="btnReset">Fortschritt löschen</button>
  </div>
</section>

<section id="edit" hidden>
  <header><button id="btnEditBack">← Übersicht</button></header>
  <h1>Neue Karten</h1>
  <div class="editor">
    <div id="repoBox" hidden>
      <label for="repo">GitHub-Repository (Benutzer/Repo)</label>
      <input id="repo" placeholder="meinname/karteikarten" autocapitalize="off">
    </div>
    <label for="eDir">Ordner (Thema)</label>
    <input id="eDir" list="dirs" placeholder="bestehend wählen oder neuen Namen tippen" autocomplete="off">
    <datalist id="dirs"></datalist>
    <label for="eSet">Set (Datei)</label>
    <input id="eSet" list="sets" placeholder="z. B. 14 Irrtumslehre" autocomplete="off">
    <datalist id="sets"></datalist>
    <label for="eF">Vorderseite</label>
    <textarea id="eF"></textarea>
    <label for="eA">Rückseite</label>
    <textarea id="eA"></textarea>
    <div class="row" style="margin-top:10px"><button id="eAdd">Karte zur Liste hinzufügen</button></div>
    <ol id="pend" class="pend"></ol>
    <div class="row"><button class="ok" id="eSave">Auf GitHub speichern</button></div>
    <p id="eInfo" class="hint"></p>
    <textarea id="eCopy" hidden readonly></textarea>
  </div>
</section>

</main>

<script>
const $ = id => document.getElementById(id);
const BASE = "themen/";
const KEY_KNOWN = "karten-gewusst-v2";

let folders = [];            // [{name, decks:[{name, path, cards:[{f,a,k}]}]}]
let cur = null, deck = [], i = 0, onlyOpen = false, known = {};

function safeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const nice = n => n.replace(/\.txt$/i, "").replace(/_/g, " ").trim();

/* ---------- Karten aus Textdatei lesen ----------
   Karten werden durch eine Zeile "====" getrennt,
   Vorder- und Rückseite durch eine Zeile "----".      */
function parse(text, path){
  return text.replace(/\r/g, "").split(/^={3,}[ \t]*$/m).map(block => {
    const parts = block.split(/^-{3,}[ \t]*$/m);
    if(parts.length < 2) return null;
    const f = parts[0].trim(), a = parts.slice(1).join("\n").trim();
    return (f && a) ? { f, a, k: path + "|" + f } : null;
  }).filter(Boolean);
}

/* ---------- Ordner und Dateien finden ---------- */
async function listViaGitHub(){
  try{
    const h = location.hostname;
    if(!h.endsWith(".github.io")) return null;
    const owner = h.split(".")[0];
    let repo = location.pathname.split("/").filter(Boolean)[0];
    if(!repo || /\.html?$/i.test(repo)) repo = h;
    const top = await (await fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents/themen")).json();
    if(!Array.isArray(top)) return null;
    const map = {};
    const add = (d, f) => { (map[d] = map[d] || []).push(f); };
    await Promise.all(top.map(async e => {
      if(e.type === "file" && /\.txt$/i.test(e.name)) add("", e.name);
      else if(e.type === "dir"){
        const sub = await (await fetch(e.url)).json();
        if(Array.isArray(sub)) sub.forEach(f => { if(f.type === "file" && /\.txt$/i.test(f.name)) add(e.name, f.name); });
      }
    }));
    return Object.keys(map).length ? map : null;
  }catch(e){ return null; }
}
async function listViaIndex(){
  try{
    const r = await fetch(BASE + "index.json");
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}

async function loadAll(){
  const map = (await listViaGitHub()) || (await listViaIndex()) || {};
  const out = [];
  for(const name of Object.keys(map).sort((a,b) => a.localeCompare(b, "de", {numeric:true}))){
    const files = map[name].slice().sort((a,b) => a.localeCompare(b, "de", {numeric:true}));
    const decks = (await Promise.all(files.map(async file => {
      const path = (name ? name + "/" : "") + file;
      try{
        const r = await fetch(BASE + path.split("/").map(encodeURIComponent).join("/"));
        if(!r.ok) return null;
        const cards = parse(await r.text(), path);
        return cards.length ? { name: nice(file), path, cards } : null;
      }catch(e){ return null; }
    }))).filter(Boolean);
    if(decks.length) out.push({ name: name ? nice(name) : "Allgemein", dir: name, decks });
  }
  folders = out;
}

/* ---------- Übersicht ---------- */
const countKnown = cards => cards.filter(c => known[c.k]).length;

function deckButton(title, cards, onclick, cls){
  const b = document.createElement("button");
  b.className = "deck" + (cls ? " " + cls : "");
  const k = countKnown(cards);
  b.innerHTML = '<div class="t"></div><div class="m"></div><div class="pb"><i></i></div>';
  b.querySelector(".t").textContent = title;
  b.querySelector(".m").textContent = cards.length + " Karten · " + k + " gewusst";
  b.querySelector("i").style.width = (cards.length ? k / cards.length * 100 : 0) + "%";
  b.onclick = onclick;
  return b;
}

function renderHome(){
  known = safeGet(KEY_KNOWN) || {};
  const list = $("list");
  list.innerHTML = "";
  if(!folders.length){
    list.innerHTML = '<p class="msg">Noch keine Karteikarten gefunden. Lege im Repository einen Ordner <b>themen</b> an, darin Unterordner mit .txt-Dateien (siehe themen/Beispiel/Vorlage.txt).</p>';
    return;
  }
  folders.forEach(fo => {
    const wrap = document.createElement("div");
    wrap.className = "folder";
    const total = fo.decks.reduce((n, d) => n + d.cards.length, 0);
    const head = document.createElement("div");
    head.className = "fhead";
    head.innerHTML = "<h2></h2><span></span>";
    head.querySelector("h2").textContent = fo.name;
    head.querySelector("span").textContent = fo.decks.length + " Sets · " + total + " Karten";
    wrap.appendChild(head);
    fo.decks.forEach(d => wrap.appendChild(deckButton(d.name, d.cards, () => start(d.name, d.cards))));
    if(fo.decks.length > 1){
      const all = fo.decks.flatMap(d => d.cards);
      wrap.appendChild(deckButton("Ganzer Ordner: " + fo.name, all, () => start(fo.name + " (alle)", all), "all"));
    }
    list.appendChild(wrap);
  });
}

/* ---------- Lernen ---------- */
function start(title, cards){
  cur = { title, cards };
  onlyOpen = false;
  $("btnOnly").textContent = "Nur offene";
  $("title").textContent = title;
  $("home").hidden = true;
  $("learn").hidden = false;
  build();
}
function build(){
  deck = cur.cards.filter(c => !(onlyOpen && known[c.k]));
  i = 0; show();
}
function show(){
  $("card").classList.remove("flip");
  const k = countKnown(cur.cards);
  $("score").textContent = k + " von " + cur.cards.length + " gewusst";
  $("bar").style.width = (cur.cards.length ? k / cur.cards.length * 100 : 0) + "%";
  if(!deck.length){
    $("count").textContent = "";
    $("front").innerHTML = '<div class="done">Alles gewusst. Tippe auf „Alle zeigen“ oder „Fortschritt löschen“.</div>';
    $("rear").textContent = ""; return;
  }
  const c = deck[i];
  $("count").textContent = (i+1) + " / " + deck.length;
  $("front").textContent = c.f;
  $("rear").textContent = c.a;
}
function flip(){ if(deck.length) $("card").classList.toggle("flip"); }
function go(d){ if(!deck.length) return; i = (i + d + deck.length) % deck.length; show(); }
function mark(v){
  if(!deck.length) return;
  const c = deck[i];
  if(v) known[c.k] = true; else delete known[c.k];
  safeSet(KEY_KNOWN, known);
  if(onlyOpen && v){ deck.splice(i,1); if(i >= deck.length) i = 0; show(); }
  else go(1);
}

$("scene").onclick = flip;
$("btnOk").onclick = () => mark(true);
$("btnNo").onclick = () => mark(false);
$("btnPrev").onclick = () => go(-1);
$("btnShuffle").onclick = () => {
  for(let n = deck.length - 1; n > 0; n--){ const j = Math.floor(Math.random()*(n+1)); [deck[n],deck[j]] = [deck[j],deck[n]]; }
  i = 0; show();
};
$("btnOnly").onclick = () => {
  onlyOpen = !onlyOpen;
  $("btnOnly").textContent = onlyOpen ? "Alle zeigen" : "Nur offene";
  build();
};
$("btnReset").onclick = () => {
  if(!confirm("Fortschritt für dieses Set löschen?")) return;
  cur.cards.forEach(c => delete known[c.k]);
  safeSet(KEY_KNOWN, known);
  build();
};
$("btnHome").onclick = () => { $("learn").hidden = true; $("home").hidden = false; renderHome(); };
document.addEventListener("keydown", e => {
  if($("learn").hidden) return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  else if(e.key === "ArrowRight") go(1);
  else if(e.key === "ArrowLeft") go(-1);
});

/* ---------- Neue Karten direkt auf der Seite erfassen ---------- */
const KEY_REPO = "karten-repo";
let pend = [], branch = "main";
const clean = s => s.trim().replace(/[\\\/:*?"<>|#%]+/g, " ").trim().replace(/\s+/g, "_");

function repoInfo(){
  const h = location.hostname;
  if(h.endsWith(".github.io")){
    let repo = location.pathname.split("/").filter(Boolean)[0];
    if(!repo || /\.html?$/i.test(repo)) repo = h;
    return { owner: h.split(".")[0], repo };
  }
  const v = String(safeGet(KEY_REPO) || "").split("/");
  return (v.length === 2 && v[0].trim() && v[1].trim()) ? { owner: v[0].trim(), repo: v[1].trim() } : null;
}
function fillSets(){
  const d = clean($("eDir").value).toLowerCase();
  const fo = folders.find(x => x.dir.toLowerCase() === d);
  $("sets").innerHTML = "";
  (fo ? fo.decks : []).forEach(k => {
    const o = document.createElement("option");
    o.value = k.path.split("/").pop().replace(/\.txt$/i, "");
    $("sets").appendChild(o);
  });
}
function renderPend(){
  const ol = $("pend");
  ol.innerHTML = "";
  pend.forEach((c, n) => {
    const li = document.createElement("li");
    li.appendChild(document.createTextNode(c.f.replace(/\s+/g, " ").slice(0, 60) + (c.f.length > 60 ? " …" : "")));
    const b = document.createElement("button");
    b.textContent = "×";
    b.setAttribute("aria-label", "Karte entfernen");
    b.onclick = () => { pend.splice(n, 1); renderPend(); };
    li.appendChild(b);
    ol.appendChild(li);
  });
  $("eSave").textContent = pend.length ? "Auf GitHub speichern (" + pend.length + " Karten)" : "Auf GitHub speichern";
}
function addCard(){
  const f = $("eF").value.trim(), a = $("eA").value.trim();
  if(!f || !a){ $("eInfo").textContent = "Vorder- und Rückseite ausfüllen."; return false; }
  pend.push({ f, a });
  $("eF").value = ""; $("eA").value = "";
  $("eInfo").textContent = "";
  renderPend();
  $("eF").focus();
  return true;
}
function openEdit(){
  $("home").hidden = true; $("edit").hidden = false;
  $("dirs").innerHTML = "";
  folders.filter(x => x.dir).forEach(x => {
    const o = document.createElement("option"); o.value = x.dir; $("dirs").appendChild(o);
  });
  const r = repoInfo();
  $("repoBox").hidden = !!r;
  if(!r) $("repo").value = safeGet(KEY_REPO) || "";
  else fetch("https://api.github.com/repos/" + r.owner + "/" + r.repo).then(x => x.json()).then(j => { if(j && j.default_branch) branch = j.default_branch; }).catch(() => {});
  fillSets(); renderPend();
}
function copyText(t){
  try{ navigator.clipboard.writeText(t).catch(() => {}); }catch(e){}
  $("eCopy").value = t; $("eCopy").hidden = false;
}
function save(){
  const info = $("eInfo");
  if($("eF").value.trim() && $("eA").value.trim()) addCard();
  if(!pend.length){ info.textContent = "Füge zuerst mindestens eine Karte hinzu."; return; }
  const dir = clean($("eDir").value), set = clean($("eSet").value).replace(/\.txt$/i, "");
  if(!dir || !set){ info.textContent = "Bitte Ordner und Set angeben."; return; }
  let r = repoInfo();
  if(!r){
    const v = $("repo").value.trim();
    if(v.split("/").length !== 2){ info.textContent = "Bitte das Repository als Benutzer/Repo angeben."; return; }
    safeSet(KEY_REPO, v); r = repoInfo();
  }
  const body = pend.map(c => c.f + "\n----\n" + c.a).join("\n\n====\n\n");
  const fo = folders.find(x => x.dir.toLowerCase() === dir.toLowerCase());
  const ex = fo && fo.decks.find(d => d.path.toLowerCase() === (fo.dir + "/" + set + ".txt").toLowerCase());
  const enc = p => p.split("/").map(encodeURIComponent).join("/");
  const root = "https://github.com/" + r.owner + "/" + r.repo;
  let url, msg;
  $("eCopy").hidden = true;
  if(ex){
    copyText("\n\n====\n\n" + body + "\n");
    url = root + "/edit/" + branch + "/themen/" + enc(ex.path);
    msg = "Set existiert schon. Die neuen Karten sind kopiert: auf GitHub ans Ende der Datei tippen, einfügen, dann Commit changes.";
  }else{
    const path = "themen/" + dir + "/" + set + ".txt";
    url = root + "/new/" + branch + "?filename=" + enc(path) + "&value=" + encodeURIComponent(body + "\n");
    if(url.length > 7000){
      copyText(body + "\n");
      url = root + "/new/" + branch + "?filename=" + enc(path);
      msg = "Text ist lang und kopiert: auf GitHub ins Textfeld einfügen, dann Commit changes.";
    }else msg = "GitHub ist offen und schon ausgefüllt: nur noch Commit changes tippen.";
  }
  const w = window.open(url, "_blank");
  info.textContent = msg + " ";
  if(!w){ const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "GitHub öffnen"; info.appendChild(a); }
  pend = []; renderPend();
}
$("btnNew").onclick = openEdit;
$("btnEditBack").onclick = () => { $("edit").hidden = true; $("home").hidden = false; renderHome(); };
$("eAdd").onclick = addCard;
$("eSave").onclick = save;
$("eDir").addEventListener("input", fillSets);

loadAll().then(renderHome);
</script>
</body>
</html>
